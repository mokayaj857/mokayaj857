<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-labelledby="t">
  <title id="t">Chain constellation from Nairobi</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#100e0c"/>
      <stop offset="100%" stop-color="#0b0a09"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="220" rx="8" fill="url(#bg)"/>

  <text x="36" y="36" fill="#c4a574" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="3.4">SIGNAL MAP  /  ORIGIN NBO</text>

  <g fill="none" stroke="#3f3a36" stroke-width="1.2">
    <path d="M180 128 L 340 78"/>
    <path d="M180 128 L 390 150"/>
    <path d="M180 128 L 560 92"/>
    <path d="M180 128 L 720 148"/>
    <path d="M180 128 L 900 86"/>
  </g>

  <g transform="translate(180,128)">
    <circle r="18" fill="#1a120e" stroke="#e85d04" stroke-width="1.6"/>
    <circle r="5" fill="#e85d04"/>
    <text x="0" y="42" text-anchor="middle" fill="#f4efe6" font-family="Georgia, serif" font-size="13">Nairobi</text>
    <text x="0" y="58" text-anchor="middle" fill="#a8a29e" font-family="ui-monospace, Consolas, monospace" font-size="10">origin</text>
  </g>

  <g font-family="ui-monospace, Consolas, monospace" text-anchor="middle">
    <g transform="translate(340,78)">
      <circle r="14" fill="#161412" stroke="#627EEA" stroke-width="1.4"/>
      <text y="4" fill="#e5e7eb" font-size="9">ETH</text>
      <text y="36" fill="#a8a29e" font-size="10" font-family="Georgia, serif">Ethereum</text>
    </g>
    <g transform="translate(390,150)">
      <circle r="14" fill="#161412" stroke="#E84142" stroke-width="1.4"/>
      <text y="4" fill="#e5e7eb" font-size="9">AVAX</text>
      <text y="36" fill="#a8a29e" font-size="10" font-family="Georgia, serif">Avalanche</text>
    </g>
    <g transform="translate(560,92)">
      <circle r="14" fill="#161412" stroke="#E6007A" stroke-width="1.4"/>
      <text y="4" fill="#e5e7eb" font-size="9">DOT</text>
      <text y="36" fill="#a8a29e" font-size="10" font-family="Georgia, serif">Polkadot</text>
    </g>
    <g transform="translate(720,148)">
      <circle r="14" fill="#161412" stroke="#0033AD" stroke-width="1.4"/>
      <text y="4" fill="#e5e7eb" font-size="8">ADA</text>
      <text y="36" fill="#a8a29e" font-size="10" font-family="Georgia, serif">Cardano</text>
    </g>
    <g transform="translate(900,86)">
      <circle r="14" fill="#161412" stroke="#4DA2FF" stroke-width="1.4"/>
      <text y="4" fill="#e5e7eb" font-size="9">SUI</text>
      <text y="36" fill="#a8a29e" font-size="10" font-family="Georgia, serif">Sui</text>
    </g>
  </g>
</svg>
